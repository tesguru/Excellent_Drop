; DropWatch queue worker
;
; Install with:
;   sudo cp deploy/supervisor/dropwatch-worker.conf /etc/supervisor/conf.d/
;   sudo supervisorctl reread && sudo supervisorctl update
;
; The worker needs the tools the pipeline shells out to:
;   zcat / gzip, awk, sort and the clickhouse-client binary.

[program:dropwatch-worker]
process_name=%(program_name)s_%(process_num)02d
command=/usr/bin/php /var/www/dropwatch/artisan queue:work --queue=zones --sleep=3 --tries=1 --timeout=0 --verbose
directory=/var/www/dropwatch
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/dropwatch/storage/logs/worker.log
stopwaitsecs=30
