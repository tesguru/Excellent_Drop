; DropWatch queue workers
;
; Install with:
;   sudo cp deploy/supervisor/dropwatch-worker.conf /etc/supervisor/conf.d/
;   sudo supervisorctl reread && sudo supervisorctl update
;
; The worker needs the tools the pipeline shells out to:
;   zcat / gzip, awk, sort and the clickhouse-client binary.
;
; The heartbeat runs on its own queue so it keeps beating while the pipeline
; worker is busy for an hour with a large zone.

[program:dropwatch-worker]
process_name=%(program_name)s_%(process_num)02d
command=/usr/bin/php /var/www/dropwatch/artisan queue:work zones --queue=zones --sleep=3 --tries=1 --timeout=0 --verbose
directory=/var/www/dropwatch
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/dropwatch/storage/logs/worker.log
stopwaitsecs=30

[program:dropwatch-heartbeat]
process_name=%(program_name)s_%(process_num)02d
command=/usr/bin/php /var/www/dropwatch/artisan queue:work --queue=heartbeat --sleep=2 --tries=1 --timeout=60
directory=/var/www/dropwatch
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/dropwatch/storage/logs/heartbeat.log
stopwaitsecs=15
