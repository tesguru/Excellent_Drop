# DropWatch web server
#
# The app is a plain Laravel application: PHP-FPM, the public directory and a
# single location block. There is no build step, the assets come from the
# Tailwind CDN.

server {
    listen 80;
    server_name dropwatch.example.com;

    root /var/www/dropwatch/public;
    index index.php;

    client_max_body_size 8m;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        include fastcgi_params;
        fastcgi_read_timeout 300;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
